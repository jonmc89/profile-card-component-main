<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link
      rel="icon"
      type="image/png"
      sizes="32x32"
      href="./images/favicon-32x32.png"
    />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Kumbh+Sans:wght,YOPQ@100..900,300&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="styles.css" />
    <title>Frontend Mentor | Profile card component</title>
  </head>
  <body>
    <img class="bg-pattern-top" src="./images/bg-pattern-top.svg" alt="" />
    <img
      class="bg-pattern-bottom"
      src="./images/bg-pattern-bottom.svg"
      alt=""
    />
    <main>
      <div class="card">
        <div class="card-top"></div>
        <div class="card-middle">
          <img
            class="profile-picture"
            src="./images/image-victor.jpg
          "
            alt="image of a man in grey jacket"
          />
          <h1>Victor Crest <span>26</span></h1>
          <p>London</p>
        </div>
        <div class="card-bottom">
          <div class="stat-wrapper">
            <h2>80K</h2>
            <p>Followers</p>
          </div>
          <div class="stat-wrapper">
            <h2>803K</h2>
            <p>Likes</p>
          </div>
          <div class="stat-wrapper">
            <h2>1.4K</h2>
            <p>Photos</p>
          </div>
        </div>
      </div>
    </main>
  </body>
</html>
